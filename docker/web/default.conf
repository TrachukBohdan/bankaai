# Production gateway: serves the static Vue bundle and reverse-proxies API
# traffic to php-fpm (the `api` service) via FastCGI.
#
# The web image does NOT carry the Laravel PHP files on disk. We hard-code
# SCRIPT_FILENAME to the path that exists inside the api container, so nginx
# does not need to call try_files against a non-existent file system.

upstream php_upstream {
    server api:9000;
}

# Pass-through that knows about reverse proxies (X-Forwarded-Proto), so
# Laravel's URL generator can produce correct https:// links behind a TLS
# terminator placed in front of this service later.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Light security headers. Tighten per-deployment as needed.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # Backend: /api/*, /sanctum/*, /up  ->  php-fpm
    # ---------------------------------------------------------------------
    location ^~ /api/ {
        include       fastcgi_params;
        fastcgi_pass  php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param HTTPS           $forwarded_proto;
        fastcgi_read_timeout 60s;
    }

    location ^~ /sanctum/ {
        include       fastcgi_params;
        fastcgi_pass  php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param HTTPS           $forwarded_proto;
    }

    location = /up {
        include       fastcgi_params;
        fastcgi_pass  php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param HTTPS           $forwarded_proto;
    }

    # ---------------------------------------------------------------------
    # Frontend: hashed assets get long-cache; everything else falls through
    # to index.html so Vue Router's history mode works.
    # ---------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide dot-files at the doc root (anchored so /assets/*.vite/* style
    # paths produced by future bundlers are not affected).
    location ~ ^/\.(?!well-known).* {
        deny all;
    }
}
