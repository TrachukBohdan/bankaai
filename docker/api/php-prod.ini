; Production overrides layered on top of php.ini-production.
; Loaded from $PHP_INI_DIR/conf.d/zz-prod.ini so it wins by lexical ordering.

; --- OPcache --------------------------------------------------------------
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Don't stat() every request — the code is immutable inside the image.
opcache.validate_timestamps=0
opcache.fast_shutdown=1
opcache.jit_buffer_size=64M
opcache.jit=tracing

; --- Hardening ------------------------------------------------------------
expose_php=Off

; --- Limits ---------------------------------------------------------------
memory_limit=256M
post_max_size=25M
upload_max_filesize=25M
max_execution_time=60

; --- Logging --------------------------------------------------------------
; PHP error log goes to stderr so `docker logs api` shows it.
log_errors=On
error_log=/dev/stderr
display_errors=Off
display_startup_errors=Off
