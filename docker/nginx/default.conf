# Single-port dev gateway for BankaAi.
#
#   /api/*, /sanctum/*, /up, *.php  ->  FastCGI to php-fpm (api:9000)
#   everything else                 ->  reverse proxy to Vite dev server (ui:5173)
#
# WebSocket upgrade is wired for the "everything else" branch so Vite HMR works
# through the proxy.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Laravel's public/ is the document root; the bind mount in docker-compose.yml
    # mounts ./api into /var/www/html, so public/index.php lives at the path below.
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25m;

    # Laravel back-end routes (REST API, Sanctum CSRF cookie, health endpoint).
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /sanctum/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # FastCGI hand-off to php-fpm. Catches /index.php (the rewrites above) and
    # any other *.php that lands in public/.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass api:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        include fastcgi_params;

        fastcgi_read_timeout 60s;
    }

    # Everything else -> Vite dev server. The Upgrade/Connection headers are
    # required for HMR's WebSocket to work through the proxy.
    #
    # We also explicitly clear `Sec-WebSocket-Extensions` so the browser does
    # NOT negotiate `permessage-deflate` with Vite. Vite's `ws` server can't
    # decode compressed frames and would crash with
    #   "Invalid WebSocket frame: RSV1 must be clear"
    # the moment a compressed frame arrives.
    location / {
        proxy_pass http://ui:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade                 $http_upgrade;
        proxy_set_header Connection              $connection_upgrade;
        proxy_set_header Sec-WebSocket-Extensions "";
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto       $scheme;
        proxy_buffering    off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # Hide hidden files at the document root (e.g. /.git, /.env, /.htaccess).
    # The pattern is anchored with ^ so it does NOT match deep paths such as
    # /node_modules/.vite/deps/*.js which the Vite dev server serves to the
    # browser during HMR.
    location ~ ^/\.(?!well-known).* {
        deny all;
    }
}
