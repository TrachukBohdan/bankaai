name: bankaai

services:
  db:
    image: mysql:8.0
    container_name: bankaai_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bankaai}
      MYSQL_USER: ${DB_USERNAME:-bankaai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - bankaai_net

  api:
    build:
      context: ./api
      dockerfile: ../docker/api/Dockerfile
    image: bankaai/api:dev
    container_name: bankaai_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9000"
    volumes:
      - ./api:/var/www/html
      - api_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:${WEB_PORT:-8080}
      FRONTEND_URL: http://localhost:${WEB_PORT:-8080}
      SANCTUM_STATEFUL_DOMAINS: "localhost:${WEB_PORT:-8080},localhost:${UI_HMR_PORT:-5173},127.0.0.1:${WEB_PORT:-8080},127.0.0.1:${UI_HMR_PORT:-5173}"
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE:-bankaai}
      DB_USERNAME: ${DB_USERNAME:-bankaai}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: database
    networks:
      - bankaai_net

  queue:
    image: bankaai/api:dev
    container_name: bankaai_queue
    restart: unless-stopped
    depends_on:
      - api
    command: ["sh", "-c", "exec php artisan queue:work --tries=3 --queue=default --sleep=1"]
    volumes:
      - ./api:/var/www/html
      - api_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE:-bankaai}
      DB_USERNAME: ${DB_USERNAME:-bankaai}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: database
    networks:
      - bankaai_net

  scheduler:
    image: bankaai/api:dev
    container_name: bankaai_scheduler
    restart: unless-stopped
    depends_on:
      - api
      - queue
    command: ["sh", "/usr/local/bin/scheduler-entrypoint.sh"]
    volumes:
      - ./api:/var/www/html
      - api_vendor:/var/www/html/vendor
      - ./docker/api/scheduler-entrypoint.sh:/usr/local/bin/scheduler-entrypoint.sh:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE:-bankaai}
      DB_USERNAME: ${DB_USERNAME:-bankaai}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
    networks:
      - bankaai_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: bankaai_mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"
    expose:
      - "1025"
    networks:
      - bankaai_net

  ui:
    build:
      context: ./ui
      dockerfile: ../docker/ui/Dockerfile
    image: bankaai/ui:dev
    container_name: bankaai_ui
    restart: unless-stopped
    # Vite is reachable both behind nginx (port WEB_PORT) and directly on
    # UI_HMR_PORT. HMR traffic goes through the direct port so a flaky
    # WebSocket can never poison the nginx -> php-fpm path or take down
    # Vite via proxy header rewrites.
    ports:
      - "${UI_HMR_PORT:-5173}:5173"
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:${WEB_PORT:-8080}/api
      VITE_HMR_CLIENT_PORT: ${UI_HMR_PORT:-5173}
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - bankaai_net

  nginx:
    image: nginx:1.27-alpine
    container_name: bankaai_nginx
    restart: unless-stopped
    depends_on:
      - api
      - ui
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./api:/var/www/html:ro
    networks:
      - bankaai_net

networks:
  bankaai_net:
    driver: bridge

volumes:
  db_data:
  api_vendor:
  ui_node_modules:
